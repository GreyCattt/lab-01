[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.4.0"
description = "A local inverted index search engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=7.2.2",
    "matplotlib>=3.10.9",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pyright>=1.1.350",
    "ruff>=0.3.0",
    "types-beautifulsoup4>=4.12.0.20250516",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pyright]
typeCheckingMode = "strict"
