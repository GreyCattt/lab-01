name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    # Встановлюємо uv - найшвидший пакетний менеджер для Python
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true
        
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    # Встановлюємо залежності проєкту
    - name: Install dependencies
      run: uv sync
      
    # 1. Запускаємо Ruff (швидкий лінтер)
    - name: Run Ruff
      run: uv run ruff check src/findex
      
    # 2. Запускаємо сувору типізацію Pyright
    - name: Run Pyright
      run: uv run pyright
      
    # 3. Запускаємо всі тести (pytest + hypothesis)
    - name: Run Pytest
      run: uv run pytest -v